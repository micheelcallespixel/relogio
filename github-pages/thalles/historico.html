<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico do Thalles</title>
<style>
@font-face { font-family: Montserrat; font-weight: 500; src: url(../fonts/montserrat-500.ttf) format('truetype'); }
@font-face { font-family: Montserrat; font-weight: 700; src: url(../fonts/montserrat-700.ttf) format('truetype'); }
:root { --accent: #FFC20E; --card: #1a1a1a; --muted: #9a9a9a; }
body { margin: 0; background: #000; color: #fff; font-family: Montserrat, Arial, sans-serif; padding: 24px 16px 40px; }
h1 { font-size: 13px; letter-spacing: .5em; color: var(--accent); text-align: center; font-weight: 500; margin: 0; }
h2 { font-size: 22px; text-align: center; text-transform: uppercase; margin: 10px 0 22px; }
a.voltar { color: var(--muted); font-size: 14px; text-decoration: none; display: block; text-align: center; margin-bottom: 20px; }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; margin: 0 auto; font-size: 14px; white-space: nowrap; }
th { color: var(--accent); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 8px 10px; text-align: left; }
td { padding: 12px 10px; border-top: 1px solid #222; font-weight: 500; }
td.dia { font-weight: 700; }
.atraso { color: #ff8a65; }
.vazio { color: #555; }
#msg { text-align: center; color: var(--muted); margin-top: 30px; }
</style>
</head>
<body>
<h1>CALLESLAB</h1>
<h2>Histórico do Thalles</h2>
<a class="voltar" href="../">← voltar ao relógio</a>
<div class="wrap"><table id="tab"></table></div>
<div id="msg">Carregando…</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
(function () {
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  function hora(ms) { if (!ms) return ''; var d = new Date(ms - 3 * 3600 * 1000); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
  function dur(a, b) {
    if (!a || !b) return '';
    var m = Math.round((b - a) / 60000);
    return m >= 60 ? Math.floor(m / 60) + 'h' + pad(m % 60) : m + ' min';
  }
  // senha mais de 15 min depois do alarme tocar fica destacada
  function senha(tocou, ms) {
    if (!ms) return '<span class="vazio">—</span>';
    var atrasado = tocou && ms - tocou > 15 * 60000;
    return '<span class="' + (atrasado ? 'atraso' : '') + '">' + hora(ms) + '</span>';
  }
  function demanda(d, n) {
    if (!d[n + '_inicio']) return '<span class="vazio">—</span>';
    if (!d[n + '_fim']) return 'iniciou ' + hora(d[n + '_inicio']);
    return dur(d[n + '_inicio'], d[n + '_fim']) + (d[n + '_ok'] ? ' ✓' : ' (aguardando)');
  }

  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(function (u) {
    if (!u) { document.getElementById('msg').textContent = 'Entre pelo relógio (toque no CALLESLAB) para ver o histórico.'; return; }
    firebase.firestore().collection('dias').orderBy(firebase.firestore.FieldPath.documentId(), 'desc').limit(30).get().then(function (q) {
      var h = '<tr><th>Dia</th><th>Alarme 8h</th><th>Senha</th><th>Demanda 1</th><th>Demanda 2</th><th>Alarme 20h</th><th>Senha</th><th>Demanda 3</th></tr>';
      q.forEach(function (doc) {
        var d = doc.data(), p = doc.id.split('-'), w = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
        var tocouM = d.m_tocou || d.m_push, tocouN = d.n_tocou || d.n_push;
        h += '<tr><td class="dia">' + SEMANA[w] + ' ' + p[2] + '/' + p[1] + '</td>' +
          '<td>' + (hora(tocouM) || '<span class="vazio">—</span>') + '</td><td>' + senha(tocouM, d.m_senha) + '</td>' +
          '<td>' + demanda(d, 'd1') + '</td><td>' + demanda(d, 'd2') + '</td>' +
          '<td>' + (hora(tocouN) || '<span class="vazio">—</span>') + '</td><td>' + senha(tocouN, d.n_senha) + '</td>' +
          '<td>' + demanda(d, 'd3') + '</td></tr>';
      });
      document.getElementById('tab').innerHTML = h;
      document.getElementById('msg').textContent = q.empty ? 'Ainda não há dias registrados.' : '';
    }, function () { document.getElementById('msg').textContent = 'Sem permissão para ver o histórico.'; });
  });
})();
</script>
</body>
</html>
