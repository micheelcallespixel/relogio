<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Painel CALLESLAB</title>
<style>
/* Montserrat fica na pasta fonts/ do relógio, um nível acima */
@font-face { font-family: Montserrat; font-weight: 400; src: url(../fonts/montserrat-400.ttf) format('truetype'); }
@font-face { font-family: Montserrat; font-weight: 500; src: url(../fonts/montserrat-500.ttf) format('truetype'); }
@font-face { font-family: Montserrat; font-weight: 700; src: url(../fonts/montserrat-700.ttf) format('truetype'); }

/* Feito para e-ink: só preto e branco puros (o cinza vira um cinza claro pontilhado no Kindle).
   As medidas são em rem e o script escolhe o maior 1rem (e o nº de colunas) em que tudo cabe,
   com o Kindle em pé ou deitado. */
html, body { margin: 0; padding: 0; background: #000; color: #fff; height: 100%; }
html { font-size: 8px; }
body { font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; text-align: center; overflow: hidden; text-transform: uppercase; }
#content { margin: 0 auto; }
#content > div { white-space: nowrap; }

#brand { font-size: 2.6rem; font-weight: 400; line-height: 1; letter-spacing: .56em; padding-left: .56em; }

/* sem relógio: o dia da semana é o destaque */
#weekday { margin-top: 3.4rem; font-size: 8rem; font-weight: 700; line-height: 1; letter-spacing: -.03em; }
#date { margin-top: 1.4rem; font-size: 4.2rem; font-weight: 500; line-height: 1; letter-spacing: -.02em; }
#weather { margin-top: 1.8rem; font-size: 2.8rem; font-weight: 500; line-height: 1; letter-spacing: .04em; }

hr { border: 0; border-top: .3rem solid #fff; width: 55%; margin: 3rem auto 2.6rem auto; }

#label { font-size: 2.4rem; font-weight: 700; line-height: 1; letter-spacing: .4em; padding-left: .4em; }
#list { margin: 2.2rem auto 0 auto; width: 92%; font-size: 3.6rem; font-weight: 500; line-height: 1.4; letter-spacing: -.02em;
  -webkit-column-gap: 4rem; column-gap: 4rem; }
#list.multi { text-align: left; }
#list div { -webkit-column-break-inside: avoid; break-inside: avoid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#list .vazio { font-weight: 400; }
#tomorrow { margin-top: 1.8rem; font-size: 2.1rem; font-weight: 400; line-height: 1.3; letter-spacing: .02em; }
</style>
</head>
<body>

<div id="content">
  <div id="brand">CALLESLAB</div>
  <div id="weekday"></div>
  <div id="date"></div>
  <div id="weather">&nbsp;</div>
  <hr>
  <div id="label">POSTAGENS DE HOJE</div>
  <div id="list"></div>
  <div id="tomorrow"></div>
</div>

<script>
// ES5 puro: roda no navegador antigo do Kindle.
(function () {
  // Santo Antônio do Monte - MG
  var LAT = -20.0872, LON = -45.2936;
  var DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho',
               'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var posts = {};       // { "2026-10-28": ["Cliente", ...] } vindo de posts.json
  var lastKey = '';     // dia já desenhado: o e-ink só repinta quando o dia muda

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function setText(id, txt) { var el = $(id); if (el.innerHTML !== txt) el.innerHTML = txt; }

  // Horário de Brasília (UTC-3, sem horário de verão), independente do fuso do aparelho
  function agora() { return new Date(new Date().getTime() - 3 * 3600 * 1000); }
  function chave(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }

  // nomes que não cabem na coluna; o resto perde o que vem depois do " - " ("Redefarma - Farmácia do Joel")
  var APELIDOS = { 'Clínica Kênnya Lacerda': 'Kênnya Lacerda' };
  function curto(nome) { return APELIDOS[nome] || nome.split(' - ')[0]; }

  function renderList(hoje, amanha) {
    var lista = posts[hoje] || [], html = '', i;
    for (i = 0; i < lista.length; i++) html += '<div>' + curto(lista[i]) + '</div>';
    if (!lista.length) html = '<div class="vazio">nenhuma postagem hoje</div>';
    var el = $('list');
    if (el.innerHTML !== html) el.innerHTML = html;
    // "9 postagens hoje" (com o número entre parênteses parecia o dia do mês)
    setText('label', lista.length ? lista.length + (lista.length > 1 ? ' postagens hoje' : ' postagem hoje') : 'postagens de hoje');
    var prox = posts[amanha] || [];
    setText('tomorrow', prox.length ? 'amanhã: ' + prox.length + (prox.length > 1 ? ' postagens' : ' postagem') : '');
  }

  function render(force) {
    var d = agora(), hoje = chave(d);
    if (!force && hoje === lastKey) return;
    lastKey = hoje;
    setText('weekday', DIAS[d.getUTCDay()]);
    setText('date', d.getUTCDate() + ' de ' + MESES[d.getUTCMonth()]);
    renderList(hoje, chave(new Date(d.getTime() + 86400000)));
    fit();
  }

  function get(url, ok) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange = function () {
      if (x.readyState === 4 && x.status === 200) { try { ok(JSON.parse(x.responseText)); } catch (e) {} }
    };
    x.send();
  }

  function loadPosts() {
    get('posts.json?t=' + new Date().getTime(), function (j) { posts = j; render(true); });
  }

  var TEMPO = { 0: 'céu limpo', 1: 'poucas nuvens', 2: 'parcialmente nublado', 3: 'nublado', 45: 'neblina', 48: 'neblina',
    51: 'garoa', 53: 'garoa', 55: 'garoa', 61: 'chuva fraca', 63: 'chuva', 65: 'chuva forte', 80: 'pancadas de chuva',
    81: 'pancadas de chuva', 82: 'chuva forte', 95: 'tempestade', 96: 'tempestade', 99: 'tempestade' };

  function loadWeather() {
    get('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
        '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&timezone=America%2FSao_Paulo&forecast_days=1', function (j) {
      var t = Math.round(j.current.temperature_2m), cond = TEMPO[j.current.weather_code] || '';
      var mx = Math.round(j.daily.temperature_2m_max[0]), mn = Math.round(j.daily.temperature_2m_min[0]);
      var chuva = j.daily.precipitation_probability_max[0];
      setText('weather', t + '° ' + cond + ' · máx ' + mx + '° · mín ' + mn + '°' +
        (chuva >= 30 ? ' · chuva ' + chuva + '%' : ''));
      fit();
    });
  }

  // Coube? Nada passa da altura e nenhuma linha é cortada na largura.
  function cabe(h) {
    var c = $('content'), els = c.getElementsByTagName('div'), i;
    if (c.offsetHeight > h * 0.94) return false;
    for (i = 0; i < els.length; i++) {
      if (els[i].id !== 'list' && els[i].scrollWidth > els[i].clientWidth) return false;
    }
    return true;
  }

  function setCols(n) {
    var el = $('list');
    el.style.webkitColumnCount = el.style.columnCount = n;
    el.className = n > 1 ? 'multi' : '';
  }

  // Para 1, 2 e 3 colunas de nomes, acha (por busca binária) o maior 1rem em que tudo cabe;
  // fica com a combinação de letra maior. Assim serve em pé, deitado e em dia cheio.
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, c = $('content'), root = document.documentElement;
    var n = $('list').children.length, best = { u: 0, cols: 1 }, cols, lo, hi, mid, k;
    c.style.width = w + 'px';
    c.style.paddingTop = '0';
    for (cols = 1; cols <= Math.min(3, Math.max(1, n)); cols++) {
      setCols(cols);
      lo = 1; hi = Math.min(w, h) / 20;
      for (k = 0; k < 14; k++) {
        mid = (lo + hi) / 2;
        root.style.fontSize = mid + 'px';
        if (cabe(h)) lo = mid; else hi = mid;
      }
      if (lo > best.u) best = { u: lo, cols: cols };
    }
    setCols(best.cols);
    // 3% de folga: o arredondamento de pixel do Kindle pode cortar um nome no limite
    root.style.fontSize = best.u * 0.97 + 'px';
    c.style.paddingTop = Math.max(0, (h - c.offsetHeight) / 2) + 'px';
  }
  window.onresize = fit;
  window.onload = fit;
  // a fonte chega depois e muda as alturas: reajusta quando ela termina de carregar
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  render(true);
  fit();
  loadPosts();
  loadWeather();
  setInterval(render, 60000); // confere a virada do dia
  setInterval(function () { loadPosts(); loadWeather(); }, 30 * 60 * 1000);
  // recarrega a página a cada 6 h, para pegar versões novas e se recuperar de qualquer travada
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
})();
</script>
</body>
</html>
