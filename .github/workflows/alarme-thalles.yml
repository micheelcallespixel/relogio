name: Alarme do Thalles

on:
  schedule:
    # horários em UTC; acorda 20 min antes (atrasos do GitHub) e o script espera dar 8h/20h
    - cron: '40 10 * * 1-5'   # 07:40 em Brasília, seg a sex
    - cron: '40 22 * * 1-5'   # 19:40 em Brasília, seg a sex
  workflow_dispatch:           # botão "Run workflow" para testar na hora
    inputs:
      qual:
        description: 'manha ou noite'
        default: 'manha'
      zerar:
        description: 'zerar o dia (apaga o registro de hoje para testar de novo)'
        type: boolean
        default: false

jobs:
  alarme:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/alarme-thalles.js ${{ github.event.inputs.qual }} ${{ github.event.inputs.zerar == 'true' && 'zerar' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
